name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The controller's durable state store supports macOS only; on Linux it refuses
    # with RUNTIME_STATE_UNSUPPORTED, so the suite is run where the controller runs.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm run check
      - run: npm test
      - run: python3 -m unittest discover -s test -p '*_test.py'
